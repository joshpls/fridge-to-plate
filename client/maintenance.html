<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fridge To Plate | Maintenance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media', // Automatically matches user's system preferences
            theme: {
                extend: {}
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 min-h-screen flex items-center justify-center p-4 antialiased transition-colors duration-300">
    
    <div class="max-w-md w-full bg-white dark:bg-gray-900 p-8 sm:p-10 rounded-3xl border border-gray-100 dark:border-gray-800 shadow-xl text-center animate-in fade-in zoom-in-95 duration-500">
        
        <div class="w-24 h-24 mx-auto bg-orange-50 dark:bg-orange-500/10 rounded-2xl flex items-center justify-center mb-8 border border-orange-100 dark:border-orange-500/20 shadow-sm">
            <span class="text-5xl animate-pulse">🧑‍🍳</span>
        </div>

        <h1 class="text-3xl sm:text-4xl font-black text-gray-900 dark:text-white tracking-tight mb-3">
            Kitchen Closed
        </h1>
        
        <p class="text-base text-gray-500 dark:text-gray-400 font-medium mb-8 leading-relaxed">
            Fridge To Plate is currently undergoing some quick maintenance. We're wiping down the counters and upgrading the appliances. 
        </p>

        <div class="inline-flex items-center gap-2 bg-orange-100 dark:bg-orange-500/20 text-orange-700 dark:text-orange-400 px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest border border-orange-200 dark:border-orange-500/30">
            <span class="relative flex h-2.5 w-2.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-orange-500"></span>
            </span>
            Be Back Soon
        </div>
    </div>

</body>
</html>
